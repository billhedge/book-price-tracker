[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "booktracker"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.32", "beautifulsoup4>=4.13"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31"
]

[project.scripts]
booktracker = "booktracker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/booktracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax,
# B: bugbear (likely bugs), SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
